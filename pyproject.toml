# VulnVerifier paketleme, bagimlilik, test ve kod kalitesi ayarlarini tanimlar.

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vulnverifier"
version = "0.1.0"
description = "Evidence-oriented vulnerability verification tool for authorized environments."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "VulnVerifier contributors" },
]
dependencies = [
    "pillow>=10,<13",
    "rich>=13.7,<15",
    "tzdata>=2024.1; platform_system == 'Windows'",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pytest>=8,<10",
    "ruff>=0.8,<1",
]

[project.scripts]
vulnverifier = "vulnverifier.cli:uygulamayiCalistir"

[tool.hatch.build.targets.wheel]
packages = ["src/vulnverifier"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
